# GSM Service Platform — Nginx production template
# ===================================================
# Replace `your-domain.com` and adjust paths/socket to match your server,
# then:
#   sudo ln -s /etc/nginx/sites-available/gsm-platform /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# A Let's Encrypt cert can be attached with:
#   sudo certbot --nginx -d your-domain.com

# --- HTTP -> HTTPS redirect -------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    return 301 https://$host$request_uri;
}

# --- HTTPS site -------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    root /var/www/gsm-platform/public;
    index index.php;
    charset utf-8;

    # --- SSL (replace with your Certbot-generated paths) ---
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Enable once the site is fully HTTPS (or add site CSP in Laravel meta tags):
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 12m;

    # Long-lived cache for hashed build assets (Laravel Vite emits hashed names)
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Image streaming routes are dynamic; keep short caching to allow variant updates
    location ~* ^/(uploads)/(.*)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Never execute PHP inside storage/vendor/bootstrap/cache or build assets
    location ~* ^/(storage|vendor|bootstrap|cache|build)/.*\.php$ { deny all; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    # Block access to dotfiles except Let's Encrypt verification
    location ~ /\.(?!well-known).* { deny all; }
}
